name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # A login shell activates the Conda environment on Linux and Windows.
        shell: bash -el {0}
    env:
      CASADI_TUTORIAL_WIDGETS: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Create the Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: casadi-tutorial
          python-version: ${{ matrix.python-version }}
          conda-remove-defaults: "true"
      - run: ruff check .
      - run: ruff format --check casadi_tutorial scripts tests
      - run: pytest
      - name: Build executed documentation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: mkdocs build --strict
      - name: Execute all lessons and worked solutions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: pytest --nbmake --nbmake-timeout=600 notebooks solutions
      - name: Compile generated C smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python scripts/codegen_smoke.py
          gcc -fPIC -shared generated/generated_dynamics.c -o generated/generated_dynamics.so
          python scripts/load_codegen_smoke.py generated/generated_dynamics.so
