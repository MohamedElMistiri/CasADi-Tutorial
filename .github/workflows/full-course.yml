name: Full course

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run pytest --nbmake --nbmake-timeout=600 notebooks solutions
      - run: uv run mkdocs build --strict
