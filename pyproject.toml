[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casadi-tutorial"
version = "0.1.0"
description = "A tested, notebook-first CasADi course"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "casadi>=3.8,<3.9",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
tutorial = ["ipykernel>=6.29,<7", "jupyterlab>=4.2,<5"]
test = ["nbmake>=1.5,<2", "pytest>=8,<9", "ruff>=0.6,<1"]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-jupyter>=0.25,<1",
  "mkdocs-material>=9.5,<10",
  "pymdown-extensions>=10.9,<11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks", "exercises", "solutions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
