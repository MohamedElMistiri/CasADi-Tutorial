# This file configures development tools only. The tutorial is intentionally a
# repository-local collection of editable modules, not a buildable distribution.

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
# The checkout itself is the import source; no editable install is required.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks", "exercises", "solutions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
